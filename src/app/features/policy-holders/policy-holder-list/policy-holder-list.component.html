<div class="card shadow">
    <div class="card-header bg-primary text-white">
        <div class="d-flex justify-content-between align-items-center">
            <h3 class="mb-0">
                Policy Holders
            </h3>

            <button 
                class="btn btn-light"
                (click)="addPolicyHolder()">
                + add Holder
            </button>
        </div>
    </div>

    <div class="card-body">
        <div class="row mb-3">
            <div class="row md-4">
                
                <input 
                    type="text"
                    class="form-control"
                    placeholder="Search Policy Holder">
            </div>
        </div>    
        <table class="table table-bordered table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone Number</th>
                    <th>City</th>
                    <th width="180">Actions</th>
                </tr>
            </thead>

            <tbody>
                <tr *ngFor="let holder of policyHolders">
                    <td>{{ holder.policyHolderId }}</td>
                    <td>{{ holder.fullName }}</td>
                    <td>{{ holder.email }}</td>
                    <td>{{ holder.phoneNumber }}</td>
                    <td>{{ holder.city }}</td>
                    <td>
                        <button 
                            class="bth btn-warning btn-sm me-2"
                            (click)="editPolicyHolder(holder.policyHolderId)">
                            Edit    
                        </button>

                        <button 
                            class="bth btn-danger btn-sm">
                            Delete    
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
